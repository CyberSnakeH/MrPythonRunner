name: Distributions de bureau
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dépendances Python
        run: python -m pip install -e ".[desktop,build]"
      - name: Moteur de fenêtre Linux
        if: runner.os == 'Linux'
        run: python -m pip install "pywebview[qt]>=6,<7"
      - name: Dépendances de l’interface
        working-directory: frontend
        run: npm ci
      - name: Compiler, tester et empaqueter
        run: python scripts/build_desktop.py
      - name: Créer l’archive portable
        run: python scripts/archive_desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: MrPythonRunner-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
